name: Build Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile iOS Dylib
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -target arm64-apple-ios14.0 bypassEnti.m -o bypassEnti.dylib -framework Foundation

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bypassEnti-dylib
          path: bypassEnti.dylib

