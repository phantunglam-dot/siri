name: Build Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile iOS Dylib
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -isysroot "$SDKPATH" -miphoneos-version-min=14.0 bypassEnti.m -o bypassEnti.dylib -framework Foundation -framework UIKit

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bypassEnti-dylib
          path: bypassEnti.dylib
